<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Invitation — Brothers Prospection</title>
  <style>:root{--bg:#f4f7fb;--panel:#fff;--line:#dfe6ee;--text:#182433;--muted:#6f7d8f;--accent:#2563eb;--shadow:0 18px 55px rgba(33,49,72,.10)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,rgba(37,99,235,.09),transparent 28%),radial-gradient(circle at 88% 88%,rgba(114,87,216,.06),transparent 30%),var(--bg)}.card{width:min(470px,100%);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:var(--shadow)}.brand{display:flex;gap:12px;align-items:center;font-weight:800;letter-spacing:-.03em}.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#4f83f1,#2563eb);color:#fff;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}h1{font-size:29px;line-height:1.08;letter-spacing:-.04em;margin:26px 0 9px}.intro{color:var(--muted);line-height:1.55;font-size:14px;margin-bottom:21px}.state{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eef4ff;color:#2d5fa9;font-size:11px;font-weight:750;margin-bottom:18px}.state.error{background:#fff0f0;color:#b93636}.state.success{background:#eaf8f0;color:#17804f}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;font-weight:700;color:#445267}.input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);outline:none;font:inherit}.input:focus{border-color:#7aa5f8;box-shadow:0 0 0 3px rgba(37,99,235,.10)}.input[readonly]{background:#f8fafc;color:#667588}.btn{width:100%;border:0;border-radius:12px;padding:12px 15px;background:var(--accent);color:#fff;font:inherit;font-weight:750;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.message{margin-top:14px;padding:11px 12px;border-radius:12px;background:#eef6ff;color:#315f98;font-size:12px;line-height:1.5}.message.error{background:#fff1f1;color:#b93636}.hidden{display:none!important}</style>
</head>
<body>
  <main class="card"><div class="brand"><div class="mark">B</div><div>Brothers<small>Prospection</small></div></div><h1>Rejoins l’espace commercial.</h1><p class="intro">Ton compte te donnera accès au même pipeline, aux mêmes prospects et aux mêmes relances que l’équipe, uniquement dans Brothers Prospection.</p><div id="inviteState" class="state">Vérification de l’invitation…</div><form id="inviteForm" class="hidden"><div class="field"><label>Adresse e-mail</label><input id="inviteEmail" class="input" type="email" readonly></div><div class="field"><label>Mot de passe</label><input id="invitePassword" class="input" type="password" minlength="6" required autocomplete="current-password" placeholder="6 caractères minimum"></div><div id="confirmField" class="field"><label>Confirmer le mot de passe</label><input id="inviteConfirm" class="input" type="password" minlength="6" autocomplete="new-password"></div><button id="inviteSubmit" class="btn" type="submit">Continuer</button></form><div id="inviteMessage" class="message hidden"></div></main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const db=createClient('https://hjmbajbhhglqzqetptys.supabase.co','sb_publishable_ePthilRsYOzeHYbqrpZ7cg_iDoke9jk',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const token=new URL(location.href).searchParams.get('invite')||'',state=document.getElementById('inviteState'),form=document.getElementById('inviteForm'),email=document.getElementById('inviteEmail'),password=document.getElementById('invitePassword'),confirm=document.getElementById('inviteConfirm'),confirmField=document.getElementById('confirmField'),message=document.getElementById('inviteMessage'),submit=document.getElementById('inviteSubmit');let accountExists=false;
    const setState=(text,type='')=>{state.textContent=text;state.className='state'+(type?' '+type:'')};const show=(text,error=false)=>{message.textContent=text;message.classList.toggle('hidden',!text);message.classList.toggle('error',error)};
    async function accept(){const {data,error}=await db.functions.invoke('crm-invite-accept',{body:{token}});if(error||!data?.ok){show('Impossible d’activer cet accès. Vérifie que tu utilises bien l’adresse invitée.',true);return false}setState('Accès activé','success');show('Accès activé. Ouverture de Brothers Prospection…');setTimeout(()=>location.replace('./'),650);return true}
    async function load(){if(!token){setState('Invitation invalide','error');show('Ce lien d’invitation est incomplet.',true);return}try{const {data,error}=await db.functions.invoke('crm-invite-info',{body:{token}});if(error||!data?.ok){setState('Invitation indisponible','error');show('Cette invitation est invalide, expirée ou a déjà été utilisée.',true);return}email.value=data.email;accountExists=!!data.account_exists;const {data:{session}}=await db.auth.getSession();if(session){if((session.user.email||'').toLowerCase()===data.email.toLowerCase()){setState('Compte reconnu','success');show('Activation de ton accès…');await accept();return}await db.auth.signOut()}confirmField.classList.toggle('hidden',accountExists);confirm.required=!accountExists;password.autocomplete=accountExists?'current-password':'new-password';submit.textContent=accountExists?'Se connecter et rejoindre':'Créer mon compte';form.classList.remove('hidden');setState(accountExists?'Invitation valide — connexion requise':'Invitation valide','success')}catch(e){console.error(e);setState('Erreur de vérification','error');show('Impossible de vérifier cette invitation.',true)}}
    form.addEventListener('submit',async e=>{e.preventDefault();if(password.value.length<6)return show('Le mot de passe doit contenir au moins 6 caractères.',true);if(!accountExists&&password.value!==confirm.value)return show('Les deux mots de passe ne correspondent pas.',true);submit.disabled=true;submit.textContent=accountExists?'Connexion…':'Création…';show(accountExists?'Connexion au compte…':'Création du compte…');try{if(accountExists){const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){show('Connexion impossible : vérifie ton mot de passe.',true);return}await accept()}else{const redirect=`${location.origin}${location.pathname}?invite=${encodeURIComponent(token)}`;const {data,error}=await db.auth.signUp({email:email.value.trim(),password:password.value,options:{emailRedirectTo:redirect}});if(error){show(error.message||'Impossible de créer le compte.',true);return}if(data?.session){await accept()}else{form.classList.add('hidden');setState('Compte créé','success');show('Compte créé. Confirme maintenant ton adresse e-mail : le lien de confirmation te ramènera ici pour activer automatiquement ton accès.')}}catch(e){console.error(e);show('Impossible de finaliser l’accès pour le moment.',true)}finally{submit.disabled=false;submit.textContent=accountExists?'Se connecter et rejoindre':'Créer mon compte'}});load();
  </script>
</body>
</html>
