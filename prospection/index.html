<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Brothers Prospection</title>
  <style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182433}.loading{min-height:100vh;display:grid;place-items:center}.box{background:#fff;border:1px solid #dfe6ee;border-radius:20px;padding:28px;box-shadow:0 18px 55px rgba(33,49,72,.10);text-align:center}.box strong{display:block;margin-bottom:6px}.box span{font-size:13px;color:#6f7d8f}</style>
</head>
<body>
  <div class="loading"><div class="box"><strong>Brothers Prospection</strong><span>Chargement de l’espace commercial…</span></div></div>
  <script>
    (async()=>{
      try{
        const source='https://raw.githubusercontent.com/clementmahu7-a11y/Brothers-Studios/6fe3a8233f16da2dba80453135afaed38c09be18/prospection/index.html';
        let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('source');return r.text()});
        html=html.replace('</head>','<link rel="stylesheet" href="./light.css"><link rel="stylesheet" href="./mobile-fix.css"></head>');
        html=html.replace('</body>','<script type="module" src="./team.js"><\/script><script type="module">import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const c=createClient("https://hjmbajbhhglqzqetptys.supabase.co","sb_publishable_ePthilRsYOzeHYbqrpZ7cg_iDoke9jk");const k="crm_team_login_refresh";c.auth.onAuthStateChange((event,s)=>{if(event==="SIGNED_OUT")sessionStorage.removeItem(k);if(event==="SIGNED_IN"&&s&&!sessionStorage.getItem(k)){sessionStorage.setItem(k,"1");setTimeout(()=>location.reload(),180)}});<\/script></body>');
        document.open();document.write(html);document.close();
      }catch(e){document.body.innerHTML='<div class="loading"><div class="box"><strong>Impossible de charger Brothers Prospection</strong><span>Actualise la page dans quelques instants.</span></div></div>'}
    })();
  </script>
</body>
</html>
