<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Invitation administrateur Brothers Studios.">
  <title>Invitation administrateur — Brothers Studios</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="./admin-invite.css">
</head>
<body>
  <main class="invite-shell">
    <section class="invite-card">
      <div class="brand"><div class="brand-mark">BS</div><div><strong>Brothers Studios</strong><span>Social Planner</span></div></div>
      <div id="inviteState" class="state-badge">Vérification de l’invitation…</div>
      <h1>Créer votre accès administrateur</h1>
      <p class="intro">Cette invitation donne accès à l’ensemble des clients et publications de Brothers Social Planner.</p>

      <form id="adminInviteForm" class="invite-form hidden">
        <label><span>Adresse email invitée</span><input id="adminInviteEmail" type="email" readonly></label>
        <label><span>Mot de passe</span><input id="adminInvitePassword" type="password" autocomplete="new-password" minlength="6" required placeholder="6 caractères minimum"></label>
        <label><span>Confirmer le mot de passe</span><input id="adminInvitePasswordConfirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Retapez le mot de passe"></label>
        <button id="adminInviteSubmit" type="submit" class="primary-btn">Créer mon compte administrateur</button>
      </form>

      <div id="adminInviteMessage" class="message hidden"></div>
      <a class="back-link" href="./">← Retour à la connexion</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script src="./admin-invite.js"></script>
</body>
</html>
